<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" width="1000" height="1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0E4A39"/>
      <stop offset="1" stop-color="#05201A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C9962B"/>
      <stop offset="1" stop-color="#F6D06B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset="0.38" stop-color="#E5484D"/>
      <stop offset="0.55" stop-color="#F6D06B"/>
      <stop offset="1" stop-color="#7EE2A8"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1600" fill="url(#bg)"/>
  <!-- grade sutil -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="1000" x2="1000" y2="1000"/><line x1="0" y1="1100" x2="1000" y2="1100"/>
    <line x1="0" y1="1200" x2="1000" y2="1200"/><line x1="0" y1="1300" x2="1000" y2="1300"/>
    <line x1="0" y1="1400" x2="1000" y2="1400"/>
  </g>
  <!-- barras crescentes -->
  <g fill="url(#gold)" opacity="0.92">
    <rect x="470" y="1310" width="70" height="140" rx="10"/>
    <rect x="570" y="1230" width="70" height="220" rx="10"/>
    <rect x="670" y="1130" width="70" height="320" rx="10"/>
    <rect x="770" y="1010" width="70" height="440" rx="10"/>
  </g>
  <!-- linha que desce no vermelho e sobe -->
  <path d="M60 1040 C150 1120 230 1260 330 1300 S470 1280 540 1210 S700 1020 900 880"
        fill="none" stroke="url(#line)" stroke-width="16" stroke-linecap="round"/>
  <path d="M870 860 L925 865 L905 918" fill="none" stroke="#7EE2A8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- moedas -->
  <g fill="none" stroke="#F6D06B" stroke-opacity="0.35" stroke-width="6">
    <circle cx="150" cy="880" r="46"/><circle cx="150" cy="880" r="30"/>
    <circle cx="880" cy="640" r="30"/>
  </g>
  <rect x="80" y="1450" width="840" height="4" fill="#ffffff" fill-opacity="0.15"/>
  <!-- textos -->
  <g font-family="Inter, 'Inter Display', Arial, sans-serif">
    <text x="80" y="205" fill="#F6D06B" font-size="34" font-weight="700" letter-spacing="8">GUIA PRÁTICO · FINANÇAS</text>
    <text x="80" y="330" fill="#ffffff" font-size="132" font-weight="800" letter-spacing="-3">Saia do</text>
    <text x="80" y="470" fill="#ffffff" font-size="132" font-weight="800" letter-spacing="-3">Vermelho</text>
    <text x="80" y="610" fill="#F6D06B" font-size="132" font-weight="800" letter-spacing="-3">em 90 dias</text>
    <text x="80" y="690" fill="#ffffff" fill-opacity="0.82" font-size="38" font-weight="500">Quite dívidas, organize o dinheiro</text>
    <text x="80" y="740" fill="#ffffff" fill-opacity="0.82" font-size="38" font-weight="500">e monte sua primeira reserva.</text>
    <text x="80" y="1490" fill="#ffffff" fill-opacity="0.7" font-size="30" font-weight="600" letter-spacing="6">SUA MARCA</text>
  </g>
</svg>
