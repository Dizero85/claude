<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" width="1000" height="1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2A2370"/>
      <stop offset="1" stop-color="#120F33"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#FF9F6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1600" fill="url(#bg)"/>
  <rect width="1000" height="1600" fill="url(#glow)"/>
  <!-- tracker 6x5 = 30 dias; 22 marcados -->
  <g transform="translate(110 790)">
    <g id="done" fill="url(#fill)">
      <rect x="0"   y="0" width="100" height="100" rx="22"/><rect x="132" y="0" width="100" height="100" rx="22"/>
      <rect x="264" y="0" width="100" height="100" rx="22"/><rect x="396" y="0" width="100" height="100" rx="22"/>
      <rect x="528" y="0" width="100" height="100" rx="22"/><rect x="660" y="0" width="100" height="100" rx="22"/>
      <rect x="0"   y="132" width="100" height="100" rx="22"/><rect x="132" y="132" width="100" height="100" rx="22"/>
      <rect x="264" y="132" width="100" height="100" rx="22"/><rect x="528" y="132" width="100" height="100" rx="22"/>
      <rect x="660" y="132" width="100" height="100" rx="22"/>
      <rect x="0"   y="264" width="100" height="100" rx="22"/><rect x="132" y="264" width="100" height="100" rx="22"/>
      <rect x="264" y="264" width="100" height="100" rx="22"/><rect x="396" y="264" width="100" height="100" rx="22"/>
      <rect x="528" y="264" width="100" height="100" rx="22"/><rect x="660" y="264" width="100" height="100" rx="22"/>
      <rect x="0"   y="396" width="100" height="100" rx="22"/><rect x="132" y="396" width="100" height="100" rx="22"/>
      <rect x="264" y="396" width="100" height="100" rx="22"/><rect x="396" y="396" width="100" height="100" rx="22"/>
      <rect x="528" y="396" width="100" height="100" rx="22"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5">
      <rect x="396" y="132" width="100" height="100" rx="22"/>
      <rect x="660" y="396" width="100" height="100" rx="22"/>
      <rect x="0" y="528" width="100" height="100" rx="22"/><rect x="132" y="528" width="100" height="100" rx="22"/>
      <rect x="264" y="528" width="100" height="100" rx="22"/><rect x="396" y="528" width="100" height="100" rx="22"/>
      <rect x="528" y="528" width="100" height="100" rx="22"/><rect x="660" y="528" width="100" height="100" rx="22"/>
    </g>
    <!-- check no último dia marcado -->
    <path d="M553 448 L572 468 L604 428" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, 'Inter Display', Arial, sans-serif">
    <text x="80" y="205" fill="#FFB38A" font-size="34" font-weight="700" letter-spacing="8">DESENVOLVIMENTO PESSOAL</text>
    <text x="80" y="340" fill="#ffffff" font-size="150" font-weight="800" letter-spacing="-4">Hábitos</text>
    <text x="80" y="495" fill="#ffffff" font-size="150" font-weight="800" letter-spacing="-4">que <tspan fill="#FFB38A">ficam</tspan></text>
    <text x="80" y="590" fill="#ffffff" fill-opacity="0.82" font-size="38" font-weight="500">O método de 30 dias para vencer</text>
    <text x="80" y="640" fill="#ffffff" fill-opacity="0.82" font-size="38" font-weight="500">a procrastinação.</text>
    <text x="80" y="1490" fill="#ffffff" fill-opacity="0.7" font-size="30" font-weight="600" letter-spacing="6">BOAONDA</text>
  </g>
</svg>
