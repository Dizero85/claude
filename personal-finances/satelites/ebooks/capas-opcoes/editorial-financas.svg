<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" width="1000" height="1600">
<style>@import url("../_build/fonts.css");</style>
<defs><radialGradient id="papel" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E6DCCB"/></radialGradient></defs>
<rect width="1000" height="1600" fill="#F4EFE6"/>
<rect x="0" y="0" width="1000" height="1600" fill="url(#papel)" opacity=".5"/>
<text x="90" y="200" font-family="Manrope" font-size="24" font-weight="800" letter-spacing="9" fill="#151515">BOAONDA</text>
<text x="910" y="200" text-anchor="end" font-family="Manrope" font-size="22" font-weight="600" letter-spacing="6" fill="#151515" fill-opacity=".6">FINANÇAS PESSOAIS</text>
<line x1="90" y1="228" x2="910" y2="228" stroke="#151515" stroke-width="2"/>
<text x="90" y="420" font-family="Fraunces" font-weight="300" font-size="150" letter-spacing="-5" fill="#151515">Saia do</text><text x="90" y="570" font-family="Fraunces" font-weight="300" font-size="150" letter-spacing="-5" fill="#151515">Vermelho</text><text x="90" y="720" font-family="Fraunces" font-style="italic" font-weight="300" font-size="150" letter-spacing="-5" fill="#1F4D3A">em 90 dias</text>
<g transform="translate(0 0)"><line x1="90" y1="1250" x2="910" y2="1250" stroke="#1A1A1A" stroke-opacity=".25" stroke-width="2"/><path d="M90 1030 C230 1150 330 1250 430 1240 S650 1060 910 860" fill="none" stroke="#1F4D3A" stroke-width="5"/><circle cx="430" cy="1240" r="12" fill="#F4EFE6" stroke="#B9472F" stroke-width="4"/><circle cx="910" cy="860" r="16" fill="#B8893A"/><text x="430" y="1295" text-anchor="middle" font-family="Manrope" font-size="22" font-weight="600" letter-spacing="4" fill="#1A1A1A" fill-opacity=".55">DIA 1</text><text x="910" y="830" text-anchor="end" font-family="Manrope" font-size="22" font-weight="600" letter-spacing="4" fill="#1F4D3A">DIA 90</text></g>
<line x1="90" y1="1340" x2="910" y2="1340" stroke="#151515" stroke-width="2"/>
<text x="90" y="1390" font-family="Manrope" font-size="28" font-weight="400" fill="#151515" fill-opacity=".7">Quite dívidas, organize o dinheiro</text><text x="90" y="1430" font-family="Manrope" font-size="28" font-weight="400" fill="#151515" fill-opacity=".7">e monte sua primeira reserva.</text>
<text x="910" y="1390" text-anchor="end" font-family="Fraunces" font-style="italic" font-weight="300" font-size="30" fill="#1F4D3A">90 Dias</text>
