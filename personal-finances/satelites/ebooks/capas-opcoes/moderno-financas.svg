<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" width="1000" height="1600">
<style>@import url("../_build/fonts.css");</style>
<defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="110"/></filter><filter id="grao"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"/></filter></defs>
<rect width="1000" height="1600" fill="#06160F"/>
<g filter="url(#blur)"><circle cx="260" cy="1180" r="420" fill="#14B07F"/><circle cx="820" cy="1350" r="300" fill="#C6F36B"/><circle cx="760" cy="820" r="220" fill="#F2C14E"/></g>
<rect width="1000" height="1600" filter="url(#grao)" opacity=".10"/>
<text x="920" y="1440" text-anchor="end" font-family="Manrope" font-weight="800" font-size="440" letter-spacing="-20" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3">90</text>
<rect x="80" y="160" width="250" height="56" rx="28" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
<text x="205" y="197" text-anchor="middle" font-family="Manrope" font-size="22" font-weight="600" letter-spacing="5" fill="#FFFFFF">90 DIAS</text>
<text x="920" y="197" text-anchor="end" font-family="Manrope" font-size="22" font-weight="800" letter-spacing="8" fill="#FFFFFF">BOAONDA</text>
<text x="80" y="430" font-family="Manrope" font-weight="800" font-size="136" letter-spacing="-6" fill="#FFFFFF">saia do</text><text x="80" y="562" font-family="Manrope" font-weight="800" font-size="136" letter-spacing="-6" fill="#FFFFFF">vermelho</text><text x="80" y="694" font-family="Manrope" font-weight="800" font-size="136" letter-spacing="-6" fill="#C6F36B">em 90 dias.</text>
<text x="80" y="784" font-family="Manrope" font-size="28" font-weight="400" fill="#FFFFFF" fill-opacity=".78">Quite dívidas, organize o dinheiro</text><text x="80" y="824" font-family="Manrope" font-size="28" font-weight="400" fill="#FFFFFF" fill-opacity=".78">e monte sua primeira reserva.</text>
<rect x="80" y="1440" width="840" height="1.5" fill="#FFFFFF" fill-opacity=".3"/>
<text x="80" y="1490" font-family="Manrope" font-size="20" font-weight="600" letter-spacing="6" fill="#FFFFFF" fill-opacity=".75">FINANÇAS PESSOAIS</text>
</svg>
